# ============================================================
# 七猫 / 通用广告拦截 补丁规则（2026-09-28 维护）
# 用法：Shadowrocket → 配置 → 当前配置 → 编辑 → [Rule] 段顶部粘贴
#
# 背景：sr_top500_whitelist_ad.conf 带 update-url，每次订阅更新都会
#       覆盖手写规则，因此把自定义规则单独存档于此，更新后重新粘贴。
#
# 语法要点（这轮踩过的坑）：
#   DOMAIN-SUFFIX,x   只匹配 x 本身与 *.x —— 匹配不到 a6-remad.x 这类连字符前缀
#   DOMAIN-KEYWORD,x  任意位置包含 x —— 专治 -remad.qm989.com 这种命名
#   DOMAIN,x          仅精确匹配 x
#   不支持通配符 *（如 pangolin-sdk-toutiao* 是无效规则，会被静默忽略）
#   REJECT=拒绝；REJECT-DROP=拒绝并丢弃（更彻底，减少客户端重试）
# ============================================================

# --- 七猫自营广告位（必须 KEYWORD）---
DOMAIN-KEYWORD,remad.qm989.com,REJECT

# --- 穿山甲（字节广告联盟，七猫主广告源；1 / 2 / -b 是不同集群）---
DOMAIN-SUFFIX,pangolin-sdk-toutiao.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao2.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao-b.com,REJECT
DOMAIN-SUFFIX,gromore.pangolin-sdk-toutiao.com,REJECT
DOMAIN-SUFFIX,pglstatp-toutiao.com,REJECT
DOMAIN-SUFFIX,pglstatp-snssdk-toutiao.com,REJECT

# --- 其他广告联盟 ---
DOMAIN-SUFFIX,ugdtimg.com,REJECT
DOMAIN-SUFFIX,adkwai.com,REJECT
DOMAIN-SUFFIX,voiceads.cn,REJECT
DOMAIN-SUFFIX,bdurl.net,REJECT
DOMAIN-SUFFIX,effirst.com,REJECT

# --- 百度 / 腾讯广告 ---
DOMAIN-SUFFIX,mobads.baidu.com,REJECT
DOMAIN-SUFFIX,pos.baidu.com,REJECT
DOMAIN-SUFFIX,als.baidu.com,REJECT-DROP
DOMAIN-SUFFIX,bgg.baidu.com,REJECT
DOMAIN-SUFFIX,gdt.qq.com,REJECT
DOMAIN-SUFFIX,sdk.e.qq.com,REJECT

# --- 统计 / 归因上报 ---
DOMAIN-SUFFIX,umeng.com,REJECT
DOMAIN-SUFFIX,umengcloud.com,REJECT
DOMAIN-SUFFIX,log.snssdk.com,REJECT
DOMAIN-SUFFIX,applog.snssdk.com,REJECT
DOMAIN-SUFFIX,mon.zijieapi.com,REJECT
DOMAIN-SUFFIX,log.zijieapi.com,REJECT
DOMAIN-SUFFIX,log-klink.zijieapi.com,REJECT
DOMAIN-SUFFIX,timon.zijieapi.com,REJECT
DOMAIN-SUFFIX,abtest-ch.snssdk.com,REJECT
DOMAIN-SUFFIX,ichannel.snssdk.com,REJECT
DOMAIN-SUFFIX,volceapplog.com,REJECT
DOMAIN-SUFFIX,ctobsnssdk.com,REJECT
DOMAIN-SUFFIX,mssdk.volces.com,REJECT
DOMAIN-SUFFIX,apmplus.volces.com,REJECT
DOMAIN-SUFFIX,dun.163.com,REJECT

