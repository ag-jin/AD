# ============================================================
# 哔哩哔哩 开屏广告 —— 已停用（2026-09-28）
#
# 【结论】不安装 CA 证书（不做 MITM 解密）就无法拦截 B站开屏广告。
#         本文件保留，仅用于记录调查结论，不要导入。
# ============================================================
#
# 为什么域名拦截做不到
# --------------------
# 开屏广告数据来自 app.bilibili.com/x/v2/splash/show —— 这是 B站正常
# 业务域名，广告混在它的响应 JSON 里，不是独立广告域名。
#
# 日志证据（设备实测）：
#   app.bilibili.com  /x/v2/splash/show  → HTTP 200，返回广告数据
#   app.bilibili.com  /x/v2/feed/index   → HTTP 200（首页内容）
# 同一域名同时承载开屏广告和首页内容，封域名 = 封掉整个 App。
#
# 唯一可行的两种做法，都必须 MITM 解密：
#   ① URL Rewrite: ^https?://app\.bilibili\.com/x/v2/splash/show - reject-dict
#      返回 HTTP 200 + 空 JSON {}，App 判定"无广告可展示"
#   ② JS 脚本改写响应体，删除广告字段（BiliUniverse/ADBlock 方案）
# 两者都要求：安装并信任证书 + [MITM] hostname 含 app.bilibili.com + MITM 开关开启
#
# 为何不推荐"半启用"MITM
# ----------------------
# 若把 app.bilibili.com 写入 [MITM] 但未装证书，B站请求会因证书不受信任
# 而失败 —— 属于"为了减少广告反而弄坏 App"的高风险配置。
# 本仓库不提供此类配置。
#
# 不使用 MITM 时可做的事
# ----------------------
# 1. 域名层面：拦 cm.bilibili.com（B站商业化域名，见 adblock-rules.conf）
#    可减少广告请求，但【不影响开屏】。
# 2. App 内：B站 → 我的 → 设置 → 隐私权限设置 → 关闭"个性化广告推荐"
#    只减少定向投放，开屏仍会显示（开屏是 B站全量商业位）。
# 3. 其他：大会员、或使用非官方改版客户端。均超出本仓库范围。
#
# 以上结论基于 2026-09-28 实测，B站若调整接口则需重新评估。
