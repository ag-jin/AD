# ============================================================
# 哔哩哔哩 开屏广告拦截（2026-09-28）
# 用法：粘贴到 Shadowrocket 配置的 [URL Rewrite] 段
#       并确保 [MITM] 的 hostname 含 app.bilibili.com
#
# 原理：app.bilibili.com/x/v2/splash/show 是开屏广告的"展示"接口。
#       reject-dict 返回 HTTP 200 + 空 JSON {}，App 解析为
#       "无广告可展示"，故不显示开屏。
#       用 reject(404) 会让 App 报错或重试，必须用 reject-dict。
#
# 范围：仅拦开屏，不影响信息流/播放/登录/投币等任何功能。
#       首页信息流、视频页、直播中的广告走的是正常 API 的响应字段，
#       域名层面无解，需要 JS 脚本改写（本仓库不涉及）。
#
# 语法：Shadowrocket 的 URL Rewrite 用 " - reject-dict"（空格+连字符），
#       与 QuantumultX 的 "url reject-dict" 写法不同，照抄会静默失效。
#
# 依赖（三条缺一不可，缺失时不报错、静默失效）：
#   ① [MITM] 的 hostname 含 app.bilibili.com
#   ② 手机已安装并【信任】Shadowrocket 的 CA 证书
#      （设置 → 通用 → VPN与设备管理 → 安装；
#        设置 → 通用 → 关于本机 → 证书信任设置 → 启用）
#   ③ Shadowrocket 里 MITM 开关已打开
#
# 排错：若规则不生效，在 [MITM] 段加一行 h2 = true。
#       B站 API 走 HTTP/2，未开启 HTTP/2 解密时无法改写请求。
# ============================================================

^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/show - reject-dict

# 可选（默认关闭）：预加载接口 /x/v2/splash/list
# 社区对该接口用"脚本改写响应体"而非 reject-dict——直接返回空 {} 会缺
# max_time / min_interval 等字段，可能引发客户端异常。
# 仅当上面那条拦不住开屏时，再取消下一行注释试验：
# ^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/list - reject-dict
